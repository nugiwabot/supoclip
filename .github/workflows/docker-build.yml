name: Build & Publish RunPod Backend Docker Image

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'runpod_backend/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/supoclip-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert image name to lowercase
        id: image-name
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${IMAGE_LOWER}:latest" >> $GITHUB_OUTPUT
          echo "tag_sha=${IMAGE_LOWER}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./runpod_backend
          file: ./runpod_backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.tag }}
            ${{ steps.image-name.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
